name: Apply schema migrations

# 👉 Only run this workflow when a change is made to the main branch
on:
  push:
    branches:
      - main

jobs:
  apply_migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pin pnpm via the official action so it wins on PATH over the runner's
      # pre-installed pnpm. The unpinned latest (pnpm 10) fails a cold install
      # with ERR_PNPM_IGNORED_BUILDS; 8.15.7 matches local + the lockfile and
      # builds the allow-listed deps (esbuild/sharp) that drizzle-kit needs.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies & tooling
        run: pnpm install
      - name: Apply migrations
        run: pnpm drizzle:migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
