name: React Doctor

# 👉 Scan every pull request automatically.
#    `--scope changed` only reports issues the PR newly introduces, so existing
#    issues can be paid down incrementally without blocking unrelated PRs.
on:
  pull_request:

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so `--scope changed` can diff against the base branch
          fetch-depth: 0
      # Pin pnpm via the official action so it wins on PATH over the runner's
      # pre-installed pnpm. `npm install -g pnpm@8` did NOT win, so CI kept using
      # pnpm 10 and failed with ERR_PNPM_IGNORED_BUILDS. 8.15.7 matches local +
      # the lockfile format.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        # React Doctor is static analysis and needs no native builds.
        run: pnpm install --ignore-scripts
      - name: Run React Doctor on changed code
        # Fails the check only on NEW error-severity issues in this PR.
        # To also block on newly-introduced warnings, add: --blocking warning
        run: npx react-doctor@latest --scope changed --base "origin/${{ github.event.pull_request.base.ref }}" --blocking error
